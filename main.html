<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>chettayi riyal</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
   <!-- Background Decorations -->
    <div class="star star1">★</div>
    <div class="star star2">☆</div>
    <div class="star star3">★</div>

    <!-- Main Chat Window -->
    <div class="window">
        <div class="title-bar">
            <span>chatbot.exe</span>
            <div class="controls">
                <div class="control-btn">_</div>
                <div class="control-btn">□</div>
                <div class="control-btn">X</div>
            </div>
        </div>
        
        <div class="chat-content">
            <div class="messages-container" id="chatBox">
                <div class="message bot">Hello! I am your aesthetic assistant. How can I help you today? ☆*: .｡. </div>
            </div>
            
            <div class="input-area">
                <input type="text" id="userInput" placeholder="Type a message..." autocomplete="off">
                <button id="sendBtn">Send</button>
            </div>
        </div>
    </div>

    <script src="main.js">   
    </script>
</body>
</html>
